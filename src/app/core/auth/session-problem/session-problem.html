<main class="flex min-h-screen items-center justify-center bg-gray-100 px-6 py-12 text-gray-900">
  <section
    class="w-full max-w-lg rounded-2xl border border-gray-200 bg-white p-8 text-center shadow-xl shadow-emerald-900/10 sm:p-10"
    aria-labelledby="session-problem-title"
  >
    <img src="logo.png" alt="Queryle" class="mx-auto mb-6 h-auto w-44" />

    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full border border-amber-200 bg-amber-50 text-amber-600">
      <svg
        class="h-10 w-10"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.3 3.8 2.7 17a2 2 0 0 0 1.74 3h15.12a2 2 0 0 0 1.74-3L13.7 3.8a2 2 0 0 0-3.4 0Z" />
      </svg>
    </div>

    <h1 id="session-problem-title" class="mt-7 text-3xl font-bold tracking-tight text-gray-900 sm:text-4xl">
      No pudimos preparar tu cuenta
    </h1>

    <p class="mx-auto mt-4 max-w-md text-sm leading-7 text-gray-500 sm:text-base">
      Tu sesión está iniciada, pero no hemos podido conectar con Queryle para
      preparar tu jugador. Puedes intentarlo de nuevo sin cerrar tu sesión.
    </p>

    <div class="mt-8 rounded-xl border border-amber-100 bg-amber-50 p-4 text-left">
      <div class="flex gap-3">
        <svg class="mt-0.5 h-5 w-5 shrink-0 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        <p class="text-sm leading-6 text-gray-600">
          Si el problema continúa, espera unos instantes y vuelve a intentarlo.
        </p>
      </div>
    </div>

    <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
      <button
        type="button"
        (click)="retry()"
        class="inline-flex min-h-12 items-center justify-center rounded-lg bg-emerald-500 px-6 text-sm font-bold text-white shadow-sm transition hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:ring-offset-2"
      >
        Reintentar conexión
      </button>

      <button
        type="button"
        (click)="logout()"
        class="inline-flex min-h-12 items-center justify-center rounded-lg border border-gray-300 bg-white px-6 text-sm font-bold text-gray-700 transition hover:border-gray-400 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:ring-offset-2"
      >
        Cerrar sesión
      </button>
    </div>
  </section>
</main>
