<section class="flex flex-col gap-6">

    <header>
        <h2 class="text-2xl font-bold text-slate-800">
            {{ 'stats.title' | translate }}
        </h2>
    </header>

    @if (loading()) {
        <div class="flex justify-center py-10">
            <span class="text-sm text-slate-500">
                {{ 'common.loading' | translate }}
            </span>
        </div>
    } @else if (error()) {
        <div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700">
            {{ 'stats.error' | translate }}
        </div>
    } @else {
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">

            @for (stat of statsCards; track stat.key) {
                <article class="flex items-center gap-4 rounded-xl border border-slate-200 bg-white p-5 shadow-sm transition-shadow hover:shadow-md">

                    <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl"
                         [class]="stat.background">

                        <ng-container *ngComponentOutlet="stat.icon"></ng-container>

                    </div>

                    <div class="flex flex-col gap-1">
                        <span class="text-sm font-medium text-slate-500">
                            {{ stat.label | translate }}
                        </span>

                        <span class="text-2xl font-bold text-slate-800">
                            {{ playerStats()[stat.key] }}
                        </span>
                    </div>

                </article>
            }

        </div>
    }

</section>
