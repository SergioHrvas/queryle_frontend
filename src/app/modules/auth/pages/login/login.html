<main class="flex min-h-screen items-center justify-center bg-gray-100 px-6 py-12 text-gray-900">
  <div class="w-full max-w-md">
    <section class="w-full rounded-2xl border border-gray-200 bg-white p-8 shadow-xl shadow-emerald-900/10 sm:p-10">
      <div class="mb-8 text-center">
        <img src="logo.png" alt="Queryle" class="mx-auto mb-5 h-auto w-48" />
        <h1 class="text-3xl font-bold tracking-tight text-gray-900">
          Bienvenido de nuevo
        </h1>
        <p class="mt-3 text-sm leading-6 text-gray-500">
          Inicia sesión para resolver los retos diarios de SQL.
        </p>
      </div>

      <div class="space-y-3">
        <button
          type="button"
          (click)="loginWithGoogle()"
          class="flex w-full items-center gap-3 rounded-lg border border-gray-200 bg-white px-4 py-3 text-sm font-bold text-gray-800 shadow-sm transition hover:border-emerald-300 hover:bg-emerald-50 focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:ring-offset-2"
        >
          <span class="flex h-6 w-6 items-center justify-center rounded-full text-base font-bold text-blue-600" aria-hidden="true">G</span>
          <span class="flex-1">Continuar con Google</span>
        </button>

        <button
          type="button"
          (click)="loginWithMicrosoft()"
          class="flex w-full items-center gap-3 rounded-lg border border-gray-200 bg-white px-4 py-3 text-sm font-bold text-gray-800 shadow-sm transition hover:border-emerald-300 hover:bg-emerald-50 focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:ring-offset-2"
        >
          <span class="flex h-6 w-6 items-center justify-center text-base font-bold text-blue-600" aria-hidden="true">⊞</span>
          <span class="flex-1">Continuar con Microsoft</span>
        </button>
      </div>

      <p class="mt-6 text-center text-xs leading-5 text-gray-500">
        Al continuar, serás redirigido al proveedor seguro de autenticación.
      </p>
    </section>
  </div>
</main>
