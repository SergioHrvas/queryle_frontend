<main class="min-h-screen bg-slate-950 px-6 py-12 text-slate-100">
  <div class="mx-auto flex min-h-[calc(100vh-6rem)] max-w-md items-center justify-center">
    <section class="w-full rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl shadow-emerald-950/30 sm:p-10">
      <div class="mb-8 text-center">
        <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-emerald-500 text-3xl font-black text-slate-950">
          Q
        </div>
        <p class="mb-2 text-sm font-semibold uppercase tracking-[0.3em] text-emerald-400">
          Queryle
        </p>
        <h1 class="text-3xl font-bold tracking-tight text-white">
          Bienvenido de nuevo
        </h1>
        <p class="mt-3 text-sm leading-6 text-slate-400">
          Inicia sesión para resolver los retos diarios de SQL.
        </p>
      </div>

      <div class="space-y-3">
        <button
          type="button"
          (click)="loginWithGoogle()"
          class="flex w-full items-center gap-3 rounded-lg bg-white px-4 py-3 text-sm font-bold text-slate-800 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:ring-offset-2 focus:ring-offset-slate-900"
        >
          <span class="flex h-6 w-6 items-center justify-center rounded-full text-base font-bold text-blue-600" aria-hidden="true">G</span>
          <span class="flex-1">Continuar con Google</span>
        </button>

        <button
          type="button"
          (click)="loginWithMicrosoft()"
          class="flex w-full items-center gap-3 rounded-lg border border-slate-700 bg-slate-800 px-4 py-3 text-sm font-bold text-white transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:ring-offset-2 focus:ring-offset-slate-900"
        >
          <span class="flex h-6 w-6 items-center justify-center text-base font-bold text-blue-400" aria-hidden="true">⊞</span>
          <span class="flex-1">Continuar con Microsoft</span>
        </button>
      </div>

      <p class="mt-6 text-center text-xs leading-5 text-slate-500">
        Al continuar, serás redirigido al proveedor seguro de autenticación.
      </p>
    </section>
  </div>
</main>
