<div class="flex flex-col items-center gap-4">
  <img src="logo.png" alt="Queryle Logo" class="mx-auto h-auto w-60" />
  <div class="flex w-full max-w-55 flex-col gap-2">
    @for (option of menuOptions; track $index) {
      <app-button
        [labelKey]="option.label"
        [icon]="option.icon"
        (click)="handle(option)"
      />
    }
  </div>
</div>

@if (showChallengeSelector()) {
  <div
    class="fixed inset-0 z-40 bg-black/50"
    (click)="closeChallengeSelector()"
  ></div>

  <section
    class="fixed left-1/2 top-1/2 z-50 max-h-[90dvh] -translate-x-1/2 -translate-y-1/2 overflow-y-auto rounded-2xl bg-slate-900 p-4 sm:p-6 shadow-xl"  
    role="dialog"
    aria-modal="true"
    (click)="$event.stopPropagation()"
  >
    <app-difficulty-selector />
  </section>
}
