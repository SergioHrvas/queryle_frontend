<div class="flex flex-col items-center gap-4">
  <img src="logo.png" alt="Queryle Logo" class="mx-auto h-auto w-60" />
  <div class="flex w-full max-w-55 flex-col gap-2">
    @for (option of menuOptions; track $index) {
      <app-button
        [labelKey]="option.label"
        [icon]="option.icon"
        [route]="option.route"
      />
    }
  </div>
</div>
